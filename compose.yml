name: gm

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gm}
      MYSQL_USER: ${MYSQL_USER:?set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    # 초기화 스크립트는 파일명 알파벳 순으로 실행된다. 원본 파일명 순서가 의존 순서와
    # 달라(food-master → mexican → schema) 번호를 붙여 마운트한다.
    # 최초 기동(빈 볼륨)에서만 실행된다. 다시 돌리려면 볼륨을 지워야 한다.
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema_v1.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/food-master-200.sql:/docker-entrypoint-initdb.d/02-food-master.sql:ro
      - ./db/mexican-menu-expansion.sql:/docker-entrypoint-initdb.d/03-mexican-menu.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # 외부 노출 없음. 앱만 내부 네트워크로 접근한다.
    expose:
      - "3306"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # 투표 상태·집계가 Redis에 있어 재시작으로 날아가면 진행 중 세션이 깨진다.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    expose:
      - "6379"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    expose:
      - "5672"
    # 관리 콘솔은 기본적으로 열지 않는다. 필요하면 SSH 포트포워딩으로 접근한다.
    #   ssh -L 15672:localhost:15672 <user>@<server>
    ports:
      - "127.0.0.1:15672:15672"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # 컨테이너 간 통신은 서비스명이 곧 호스트명이다.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gm}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SERVER_PORT: 8080
      # 스키마는 SQL로 관리한다. 앱이 테이블을 건드리지 않게 고정한다.
      JPA_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:?set in .env}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:?set in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set in .env}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:?set in .env}
      INVITE_BASE_URL: ${INVITE_BASE_URL}
      OAUTH_ONBOARDING_REDIRECT_URI: ${OAUTH_ONBOARDING_REDIRECT_URI}
      OAUTH_HOME_REDIRECT_URI: ${OAUTH_HOME_REDIRECT_URI}
      # 프론트가 Vercel(HTTPS)이라 크로스 사이트다. 이 값이 아니면 쿠키가 실리지 않는다.
      REFRESH_TOKEN_COOKIE_SECURE: "true"
      REFRESH_TOKEN_COOKIE_SAME_SITE: None
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+UseSerialGC}
    healthcheck:
      # actuator 미의존. 서버가 HTTP 응답을 돌려주면(404 포함) 살아 있는 것으로 본다.
      test: ["CMD-SHELL", "curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080/ | grep -qE '^[2-4]'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    # Caddy/nginx를 앞에 둘 때는 이 줄을 지우고 expose만 남긴다.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
