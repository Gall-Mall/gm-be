// api — 실행 가능한 웹 애플리케이션 (진입점)
// core/storage/client 모듈을 조합한다. 공통 의존성은 root subprojects에서 상속

dependencies {
    // 모듈 의존
    implementation project(':core')
    implementation project(':storage:db')
    implementation project(':storage:redis')
    implementation project(':client')
    implementation project(':mq')

    // 웹 계층
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.11'

    // storage:redis가 implementation으로 선언해 컴파일 시점에 전이되지 않는 StringRedisTemplate을
    // rate limiting 컴포넌트(api/common/ratelimit)에서 직접 참조하기 위해 별도로 선언한다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    // 아키텍처 규칙 검증 (모듈 간 의존 방향 강제)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    // MockMvc 테스트 지원 (Boot 4에서 spring-boot-starter-test와 분리됨)
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'

    // MockMvc 요청에 인증 정보를 직접 주입하기 위한 Spring Security 테스트 지원
    testImplementation 'org.springframework.security:spring-security-test'

    testRuntimeOnly 'com.h2database:h2'

    // Security Test
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.register("prepareKotlinBuildScriptModel"){}

bootJar {
    enabled = true
}

jar {
    enabled = false
}
