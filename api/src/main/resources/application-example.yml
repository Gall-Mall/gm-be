# api 모듈 진입 설정 예시 템플릿.
# 이 파일을 application.yml 로 복사한 뒤 환경에 맞게 값을 채운다.
#   cp application-example.yml application.yml
# 실제 비밀번호 등 시크릿은 application.yml(gitignore) 또는 환경변수로만 주입하고 커밋하지 않는다.
spring:
  application:
    name: gm-api

  # DB 설정. 값은 환경변수로 주입하고, 로컬 기본값만 여기에 둔다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gm?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 3000

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html

  jpa:
    hibernate:
      # 로컬은 validate 로 스키마 검증만. 운영은 none, 초기 개발은 필요 시 update.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    # 트랜잭션 밖 지연로딩을 막아 영속성 경계를 명확히 한다.
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}

  # 네이버 OAuth2 Client 설정
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID:}
            client-secret: ${NAVER_CLIENT_SECRET:}
            client-name: Naver

            # 네이버는 표준 OAuth2 제공자가 아니므로 provider를 직접 연결한다.
            provider: naver

            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post

            # SecurityConfig의 redirectionEndpoint baseUri와 일치해야 한다.
            redirect-uri: "{baseUrl}/api/auth/oauth/{registrationId}/callback"

            # 네이버에서 제공받을 사용자 정보
            scope:
              - name
              - email
              - mobile

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me

            # 네이버 응답의 최상위 사용자 속성 이름
            user-name-attribute: response


  # Redis 설정. 초대 코드 저장(SETNX·TTL)과 rate limiting 카운터에 사용한다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}

  # RabbitMQ 설정. 값은 환경변수로 주입하고, 로컬 기본값만 여기에 둔다.
  # 로컬 브로커: docker run -d --name rabbitmq -p 5672:5672 -p 15672:15672 rabbitmq:management
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 발행 신뢰성: 브로커 수신 확인(correlated) / 라우팅 실패 메시지 반송 감지
    publisher-confirm-type: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE:correlated}
    publisher-returns: ${RABBITMQ_PUBLISHER_RETURNS:true}
    # 소비 신뢰성: AUTO ack(기본) 유지 — 성공 시 ack, 예외 시 nack.
    # 재시도 소진 시 재큐하지 않고(default-requeue-rejected:false) DLQ로 보낸다.
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-retries: 3
          max-interval: 10s


server:
  port: ${SERVER_PORT:8080}

jwt:
  # Base64로 인코딩된 256bit 이상의 Secret Key
  secret: ${JWT_SECRET:YOUR_BASE64_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600}

auth:
  # OAuth 로그인 성공 후 생성되는
  # Login Exchange Code의 TTL(초) : LoginExchangeService에서 사용
  login-exchange-expiration: ${LOGIN_EXCHANGE_EXPIRATION:180}
  # RefreshTokenCookieManager에서 사용
  refresh-token-cookie:
    # Cookie 이름
    name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
    # 인증 API에서만 전송
    path: ${REFRESH_TOKEN_COOKIE_PATH:/api/auth}
    # local=false / production=true
    secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    # Strict / Lax / None
    same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}

app:
  invite:
    # 초대 링크 조립에 쓰는 서비스 base URL. 반드시 환경별 실제 값으로 채워야 한다.
    base-url: ${INVITE_BASE_URL:YOUR_FRONTEND_URL}
  # 초대 코드는 6자리라 엔트로피가 낮아, TTL 외에 rate limiting으로 브루트포스를 추가 방어한다.
  rate-limit:
    invite:
      info-per-minute: ${INVITE_RATE_LIMIT_INFO_PER_MINUTE:20}
      join-per-minute: ${INVITE_RATE_LIMIT_JOIN_PER_MINUTE:10}
      join-per-hour: ${INVITE_RATE_LIMIT_JOIN_PER_HOUR:30}

  # /oauth/success 처리용 Redirect URI. 현재는 프론트엔드와의 미연동으로 임시로 설정해둠.
  oauth2:
    success-redirect-uri: http://localhost:8080/oauth/success